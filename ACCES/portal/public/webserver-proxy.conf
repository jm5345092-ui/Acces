    ProxyPreserveHost On
    ProxyTimeout 120

    # Gate the whole webserver app behind the admin session cookie. This is
    # a coarse check (cookie presence, not validity — Apache can't read PHP
    # session data) that specifically closes the hole where logging out
    # clears the cookie but a stale proxied page/back-navigation could
    # still reach the SPA; AppShell does a real session check on top of
    # this via GET /webserver-session.php.
    RewriteEngine On
    RewriteCond %{HTTP_COOKIE} !PHPSESSID=
    RewriteRule ^/webserver/api/ - [R=401,L]
    # Explicit https://%{HTTP_HOST} (not a bare "/login.php") — Railway
    # terminates TLS at its edge and forwards plain HTTP on an internal
    # port, so a server-root-relative redirect target gets expanded by
    # Apache into that wrong internal scheme/port instead of the public
    # https URL the browser actually needs.
    RewriteCond %{HTTP_COOKIE} !PHPSESSID=
    RewriteRule ^/webserver/ https://%{HTTP_HOST}/login.php [R=302,L]

    # API (FastAPI, combined with the APK-tooling worker) — longer prefix,
    # so mod_proxy matches it ahead of the frontend's catch-all below.
    ProxyPass /webserver/api/ http://apklab-api.railway.internal:8000/api/ retry=0
    ProxyPassReverse /webserver/api/ http://apklab-api.railway.internal:8000/api/

    # Job-log SSE stream needs unbuffered, chunked forwarding.
    <Location /webserver/api/jobs/>
        SetEnv proxy-sendchunked 1
        SetEnv proxy-nokeepalive 1
    </Location>

    # Frontend (static SPA built with base path /webserver/)
    ProxyPass /webserver/ http://apklab-frontend.railway.internal/ retry=0
    ProxyPassReverse /webserver/ http://apklab-frontend.railway.internal/

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA shell must never sit in the browser's back-forward cache:
    # bfcache restores happen with zero network request, so without this a
    # logged-out user hitting Back lands right back in an authenticated-
    # looking page the server never got a chance to re-gate.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
